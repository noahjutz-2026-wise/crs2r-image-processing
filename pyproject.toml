[project]
name = "crs2r-image-processing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Noah Jutz", email = "git@noahjutz.anonaddy.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "pytest>=9.1.1",
    "scipy>=1.15.3",
]

[project.scripts]
crs2r-image-processing = "crs2r_image_processing:main"
crs2r-select-markers = "crs2r_image_processing.select_markers:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
